# One project's stack runs at a time. These labels are how the operator tool
# recognises another project's stack and can name the directory that started it.
x-baseplate-labels: &baseplate-labels
  baseplate.project-root: "${BASEPLATE_PROJECT_ROOT:-}"
  baseplate.http-port: "${HTTP_PORT:-8080}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels: *baseplate-labels
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. The operator tool applies schema changes over this, and
      # on a remote target it reaches the same port through an SSH tunnel.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: migrate/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      STORAGE_SERVICE_PASSWORD: ${STORAGE_SERVICE_PASSWORD}
    volumes:
      - ./platform:/platform:ro

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/app
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CALLER_ROLE: app_user
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-1h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Bytes only, on the compose network only. Never published, never routed by
  # Caddy, and the sole client is the storage service in front of it.
  storage-blobs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    labels: *baseplate-labels
    entrypoint: ["/bin/sh", "/baseplate-entrypoint.sh"]
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - blobs:/data
      - ./storage/blobs-entrypoint.sh:/baseplate-entrypoint.sh:ro
    expose:
      - "8333"

  storage:
    build:
      context: .
      dockerfile: storage/Dockerfile
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-blobs:
        condition: service_started
    environment:
      STORAGE_SERVICE_PASSWORD: ${STORAGE_SERVICE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage-blobs:8333}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-baseplate}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-26214400}
      PORT: "3002"
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/storage/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgrest:
        condition: service_started
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
  caddy_data:
  blobs:
