# One project's stack runs at a time. These labels are how the operator tool
# recognises another project's stack and can name the directory that started it.
x-baseplate-labels: &baseplate-labels
  baseplate.project-root: "${BASEPLATE_PROJECT_ROOT:-}"
  baseplate.http-port: "${HTTP_PORT:-8080}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels: *baseplate-labels
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. The operator tool applies schema changes over this, and
      # on a remote target it reaches the same port through an SSH tunnel.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: migrate/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      STORAGE_SERVICE_PASSWORD: ${STORAGE_SERVICE_PASSWORD}
    volumes:
      - ./platform:/platform:ro

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/app
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CALLER_ROLE: app_user
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-1h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      # Where the app that owns these users lives. Recovery and confirmation
      # links point at it, so a wrong value emails a dead link.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      REQUIRE_EMAIL_CONFIRM: ${REQUIRE_EMAIL_CONFIRM:-false}
      # Defaults point at the mailpit container below. Empty SMTP_HOST turns
      # mail off entirely: tokens are still issued, nothing is delivered.
      SMTP_HOST: ${SMTP_HOST-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Baseplate <no-reply@localhost>}
      SMTP_SECURE: ${SMTP_SECURE:-none}
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # The local inbox. Recovery and confirmation mail lands here instead of the
  # internet, so the whole reset flow can be walked without an SMTP account.
  # Nothing depends_on it: mail is best-effort, and auth signs people in whether
  # or not this is up. The cloud overlay hides it behind a profile.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    labels: *baseplate-labels
    ports:
      # Loopback only. Read the inbox at http://127.0.0.1:8025.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"

  # Bytes only, on the compose network only. Never published, never routed by
  # Caddy, and the sole client is the storage service in front of it.
  storage-blobs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    labels: *baseplate-labels
    entrypoint: ["/bin/sh", "/baseplate-entrypoint.sh"]
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - blobs:/data
      - ./storage/blobs-entrypoint.sh:/baseplate-entrypoint.sh:ro
    expose:
      - "8333"

  storage:
    build:
      context: .
      dockerfile: storage/Dockerfile
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-blobs:
        condition: service_started
    environment:
      STORAGE_SERVICE_PASSWORD: ${STORAGE_SERVICE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage-blobs:8333}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-baseplate}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-26214400}
      PORT: "3002"
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/storage/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Dumps on a schedule, seals them, and puts them where the operator said. Then
  # actually restores one into a scratch database and counts what came back,
  # because a backup nobody has restored is a hope.
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEY: ${BACKUP_KEY}
      BACKUP_EVERY: ${BACKUP_EVERY:-24h}
      DRILL_EVERY: ${DRILL_EVERY:-168h}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - backups:/backups
      - backup_scratch:/scratch

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    labels: *baseplate-labels
    depends_on:
      postgrest:
        condition: service_started
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
  caddy_data:
  blobs:
  backups:
  backup_scratch:
