name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, and enough to catch most of what breaks: types, layering, lint, units.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:arch
      - run: npm run typecheck
      - run: npm test

  # An operator installs this package; they do not run this checkout. Every path
  # that is only true here dies in this job rather than in someone's terminal.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # What is in the tarball, before anything is done with it. A nested
      # node_modules or a platform binary is a bad release, not a slow one.
      - run: npm run pack:check
      - run: bash scripts/smoke-install.sh

  # A real stack, real HTTP, two callers who cannot see each other, driven from
  # this checkout because the integration suite imports it.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the stack
        run: |
          ./scripts/dev init
          ./scripts/dev up
      - run: npm run test:integration
      - name: Show the logs when something failed
        if: failure()
        run: |
          docker ps -a
          for id in $(docker ps -aq --filter "label=baseplate.project-root"); do
            echo "===== $(docker inspect --format '{{.Name}}' "$id") ====="
            docker logs --tail 100 "$id" 2>&1 || true
          done
      - name: Stop the stack
        if: always()
        run: ./scripts/dev destroy --yes

  # The definition of done, and the only version of it that means anything to
  # someone who installed this: packed, installed, brought up from the installed
  # package, then row isolation, object isolation, password recovery and a
  # destructive restore against it.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:artifact
      - name: Show the logs when something failed
        if: failure()
        run: |
          docker ps -a
          for id in $(docker ps -aq --filter "label=baseplate.project-root"); do
            echo "===== $(docker inspect --format '{{.Name}}' "$id") ====="
            docker logs --tail 100 "$id" 2>&1 || true
          done
